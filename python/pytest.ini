[pytest]
testpaths = tests
addopts = -ra --strict-markers --junitxml=../test-results/pytest-junit.xml -o junit_family=xunit1
markers =
    unit: autotests offline del framework
    contract: regresión de contrato contra los esquemas guardados
    business: reglas de negocio
    security: autorización
    smoke: subconjunto rápido
    readme(path): carpeta (relativa a BFF/) con el README del caso para Jira
